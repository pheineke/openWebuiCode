  green: ["#16a34a", "#4ade80", "Grün"], yellow: ["#ca8a04", "#facc15", "Gelb"]};

  try { return Object.assign({mode: "auto", accent: "teal"}, JSON.parse(localStorage.appearance || "{}")); } catch { return {mode: "auto", accent: "teal"}; }

#panel button{border:0;background:none;color:var(--muted);padding:4px 7px;border-radius:6px}
#panel button:hover{color:var(--text);background:var(--side)}
.ptabs{display:flex;align-items:center;gap:4px;height:40px;box-sizing:border-box;padding:0 10px;overflow:hidden;flex:none}
.ptabs .sp,.psub .sp{flex:1}
.tab{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;max-width:200px}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.act{background:var(--bg);color:var(--text)}
.tab b{font-weight:400;opacity:.6}.tab b:hover{opacity:1}
.psub{display:flex;align-items:center;padding:6px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.pbody{flex:1;overflow:auto;background:var(--bg);min-height:0}

.code pre{margin:0;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;padding:12px 0}
.gut{color:var(--muted);text-align:right;padding:12px 12px 12px 14px!important;user-select:none;flex:none;opacity:.7}
.src{padding:12px 16px 12px 4px!important;flex:1}
.src code{font:inherit;background:none;padding:0}
.pbody iframe{border:0;width:100%;height:100%;background:#fff;display:block}
.pmsg{padding:20px;color:var(--muted)}
.tree{padding:8px}

</div>
</div>

</div></div>
<div id="login"><div class="card">
  <h1>EDU-KI-RLP</h1>
  <p>Melde dich mit deinem Hochschul-Login (Shibboleth) an. Es öffnet sich ein Browserfenster; deine Zugangsdaten gehen nur an deine Hochschule.</p>
  <button id="loginBtn">Mit Hochschul-Login anmelden</button>
  <p id="loginMsg" style="margin-top:14px;font-size:13px"></p>
</div></div>

<script>
const $ = id => document.getElementById(id);
const OW = "/ow/";
const uuid = () => crypto.randomUUID();
const now = () => Math.floor(Date.now() / 1000);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

let chat = null;          // {id|null, title, model, history:{messages,currentId}, updated_at}
let streaming = null;     // AbortController while a reply is running
let list = [];

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error("not logged in"); }
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
const json = (method, body) => ({method, headers: {"content-type": "application/json"}, body: JSON.stringify(body)});

// ---- login -------------------------------------------------------------
function showLogin(msg = "") { $("login").classList.add("on"); $("loginMsg").textContent = msg; }
$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true;
  $("loginMsg").textContent = "Browserfenster geöffnet – bitte dort anmelden…";
  try {
    await api("/app/login", {method: "POST"});
    $("login").classList.remove("on");
    await boot();
  } catch (e) { $("loginMsg").textContent = "Anmeldung fehlgeschlagen oder abgelaufen. Bitte erneut versuchen."; }
  $("loginBtn").disabled = false;
};
$("logout").onclick = async () => { await fetch("/app/logout", {method: "POST"}); chat = null; showLogin(); };

// ---- models / chat list ------------------------------------------------
async function loadModels() {
  const {data} = await api(OW + "models");
  const sel = $("model"), keep = localStorage.model;
  sel.innerHTML = data.map(m => `<option value="${esc(m.id)}">${esc(m.name || m.id)}</option>`).join("");
  sel.value = data.some(m => m.id === keep) ? keep : (data.find(m => /qwen|deepseek/.test(m.id)) || data[0]).id;
}
$("model").onchange = () => { localStorage.model = $("model").value; if (chat) chat.model = $("model").value; };

async function loadList() {
  const all = [];
  for (let pg = 1; pg <= 20; pg++) {                      // every page, not just the first
    const r = await api(OW + `v1/chats/?page=${pg}`);
    if (!r.length) break;
    all.push(...r);
  }
  list = all; renderList();
}
const SEARCH_ICON = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
function renderList() {
  const box = $("chats"); box.innerHTML = "";
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const groups = [["Heute", []], ["Gestern", []], ["Älter", []]];
  for (const c of list) { const ms = c.updated_at * 1000; groups[ms >= today ? 0 : ms >= yest ? 1 : 2][1].push(c); }
  const header = (label, withSearch) => {
    const h = document.createElement("div"); h.className = "grp";
    h.innerHTML = `<span>${label}</span><span class="sp"></span>` + (withSearch ? `<button class="gbtn" title="Chats durchsuchen (Strg+K)">${SEARCH_ICON}</button>` : "");
    if (withSearch) h.querySelector("button").onclick = openSearch;
    box.append(h);
  };
  let any = false;
  for (const [label, items] of groups) {
    if (!items.length) continue;
    header(label, !any); any = true;
    for (const c of items) {
      const el = document.createElement("div");
      el.className = "chat" + (chat && chat.id === c.id ? " active" : "");
      el.innerHTML = `<span>${esc(c.title || "Chat")}</span><button title="Löschen">✕</button>`;
      el.onclick = () => openChat(c.id);
      el.querySelector("button").onclick = async e => {
        e.stopPropagation();
        if (!confirm(`„${c.title}“ löschen?`)) return;
        await api(OW + `v1/chats/${c.id}`, {method: "DELETE"});
        if (chat && chat.id === c.id) newChat();
        loadList();
      };
      box.append(el);
    }
  }
  if (!any) header("Heute", true);
}

// ---- user menu + settings ------------------------------------------------
$("meBtn").onclick = e => { e.stopPropagation(); $("userMenu").classList.toggle("on"); };
document.addEventListener("click", () => $("userMenu").classList.remove("on"));
let settingsPage = "appearance";
function openSettings(page) { settingsPage = typeof page === "string" ? page : "appearance"; $("userMenu").classList.remove("on"); renderSettings(); $("settings").classList.add("on"); }
function closeSettings() { $("settings").classList.remove("on"); }
$("mSettings").onclick = () => openSettings("appearance");
$("mUsage").onclick = () => openSettings("usage");
document.querySelector(".snav").onclick = e => { const d = e.target.closest("[data-page]"); if (d) { settingsPage = d.dataset.page; renderSettings(); } };
$("sclose").onclick = closeSettings;
$("settings").onclick = e => { if (e.target === $("settings")) closeSettings(); };
const MODES = [["auto", "System"], ["light", "Hell"], ["dark", "Dunkel"], ["black", "Schwarz (OLED)"]];
function setAppearance(patch) {
  const a = {...loadAppearance(), ...patch};
  try { localStorage.appearance = JSON.stringify(a); } catch {}
  applyAppearance(a); renderSettings();
}
function renderSettings() {
  document.querySelectorAll(".snav [data-page]").forEach(d => d.classList.toggle("act", d.dataset.page === settingsPage));
  if (settingsPage === "usage") renderUsage(); else renderAppearance();
}
const fmtN = n => Math.round(n).toLocaleString("de-DE");
const fmtCost = c => c === 0 ? "$0" : c < 0.01 ? "$" + c.toFixed(4) : "$" + c.toFixed(2);
async function renderUsage() {
  const box = $("scont"); box.innerHTML = '<h2>Nutzung</h2><div class="pmsg" id="uload">Lädt…</div>';
  const still = () => settingsPage === "usage";
  let u;
  try {
    u = await api("/app/usage");
    if (!u.backfilled) {                          // one-off: pull figures from earlier chats
      if (still()) $("uload").textContent = "Bisherige Chats werden einmalig ausgewertet…";
      await api("/app/usage/backfill", {method: "POST"});
      u = await api("/app/usage");
    }
  } catch (e) { if (still()) box.innerHTML += `<div class="pmsg err">${esc(String(e.message))}</div>`; return; }
  const bud = await api("/app/budget").catch(() => null);
  if (!still()) return;                           // user switched page meanwhile
  const pct = bud && bud.percent != null ? Math.max(0, Math.min(100, bud.percent)) : null;
  const when = bud && bud.at ? new Date(bud.at * 1000).toLocaleString("de-DE", {dateStyle: "medium", timeStyle: "short"}) : "";
  const budget = pct === null
    ? `<div class="ucard"><div class="uhead"><b>Budget diesen Monat</b></div><p class="umuted" style="margin:0">Noch keine Angabe. Der Server meldet deinen Budgetstand bei Antworten kostenpflichtiger Modelle (z. B. Claude Sonnet 5, GPT 5.6). Sobald du eines nutzt und in der Open-WebUI-Weboberfläche chattest, erscheint er hier.</p></div>`
    : `<div class="ucard"><div class="uhead"><b>Budget diesen Monat</b><span class="pct">${pct.toLocaleString("de-DE")} %</span></div>
        <div class="ubar${pct >= 90 ? " crit" : pct >= 70 ? " warn" : ""}"><i style="width:${pct}%"></i></div>
        <p class="umuted">Zuletzt vom Server gemeldet: ${esc(when)}. Der Server meldet den Stand nur bei kostenpflichtigen Modellen – der Wert kann daher älter sein als deine letzte Anfrage.</p></div>`;
  const m = u.month, t = u.total, max = Math.max(1, ...u.days.map(d => d.tokens));
  const monthName = new Date(m.label + "-01T12:00").toLocaleDateString("de-DE", {month: "long", year: "numeric"});
  const tile = (l, v) => `<div class="tile"><small>${l}</small><b>${v}</b></div>`;
  const rows = m.models.length ? m.models.map(x => `<tr><td>${esc(x.model)}</td><td class="n">${fmtN(x.requests)}</td><td class="n">${fmtN(x.in)}</td><td class="n">${fmtN(x.out)}</td><td class="n">${fmtCost(x.cost)}</td></tr>`).join("")
    : `<tr><td colspan="5" style="color:var(--muted)">Noch keine Anfragen in diesem Monat.</td></tr>`;
  box.innerHTML = `<h2>Nutzung</h2>${budget}
    <div class="utitle">${esc(monthName)}</div>
    <div class="tiles">${tile("Anfragen", fmtN(m.requests))}${tile("Eingabe-Token", fmtN(m.in))}${tile("Ausgabe-Token", fmtN(m.out))}${tile("Kosten", fmtCost(m.cost))}</div>
    <table class="um"><tr><th>Modell</th><th class="n">Anfragen</th><th class="n">Eingabe</th><th class="n">Ausgabe</th><th class="n">Kosten</th></tr>${rows}</table>
    <div class="utitle">Letzte 30 Tage (Token pro Tag)</div>
    <div class="udays">${u.days.map(d => `<div class="${d.tokens ? "" : "z"}" style="height:${d.tokens ? Math.max(4, d.tokens / max * 100) : 3}%" title="${new Date(d.date + "T12:00").toLocaleDateString("de-DE")}: ${fmtN(d.tokens)} Token"></div>`).join("")}</div>
    <p class="umuted">Insgesamt erfasst: ${fmtN(t.requests)} Anfragen, ${fmtN(t.in + t.out)} Token, ${fmtCost(t.cost)}. Erfasst werden Anfragen über diese App und opencode seit ${new Date(u.since * 1000).toLocaleDateString("de-DE")}; frühere Chats wurden einmalig aus deinem Open-WebUI-Verlauf übernommen. Chats, die du direkt in der Weboberfläche führst, werden nicht live erfasst. Kosten laut Abrechnung des Servers (USD).</p>`;
}
function renderAppearance() {
  const a = loadAppearance(), dark = resolvedMode(a.mode) !== "light";
  const custom = !ACCENTS[a.accent];
  $("scont").innerHTML = `<h2>Darstellung</h2>
    <div class="srow"><div><b>Farbschema</b><p>Hell, dunkel oder reines Schwarz für OLED-Displays. „System“ folgt der Einstellung deines Geräts.</p></div>
      <div class="seg">${MODES.map(([k, l]) => `<button data-mode="${k}" class="${a.mode === k ? "act" : ""}">${l}</button>`).join("")}</div></div>
    <div class="srow"><div><b>Akzentfarbe</b><p>Wird für Schaltflächen, Links und Hervorhebungen verwendet.</p></div>
      <div class="sw">${Object.entries(ACCENTS).map(([k, v]) => `<button class="dot${a.accent === k ? " act" : ""}" data-acc="${k}" title="${v[2]}" style="background:${v[dark ? 1 : 0]}"></button>`).join("")}
        <label class="custom" title="Eigene Farbe"><input type="color" id="accCustom" value="${custom ? a.accent : accentFor(a, dark)}">Eigene</label></div></div>`;
  $("accCustom").oninput = e => { const a2 = {...loadAppearance(), accent: e.target.value}; try { localStorage.appearance = JSON.stringify(a2); } catch {} applyAppearance(a2); };
  $("accCustom").onchange = () => renderSettings();
}
$("scont").onclick = e => {
  const m = e.target.closest("[data-mode]"), c = e.target.closest("[data-acc]");
  if (m) setAppearance({mode: m.dataset.mode}); else if (c) setAppearance({accent: c.dataset.acc});
};
window.onAppearance = () => {   // keep the terminal in step with the theme
  if (typeof term !== "undefined" && term.t) term.t.options.theme = {background: getComputedStyle(document.documentElement).getPropertyValue("--code").trim(), foreground: "#e6edf3"};
};

// ---- search modal ----------------------------------------------------------
let sHits = [], sIdx = 0, sSeq = 0, sTimer = null;
function openSearch() { $("search").classList.add("on"); $("sq").value = ""; $("sq").focus(); runSearch(); }
function closeSearch() { $("search").classList.remove("on"); }
function mark(text, q) {
  if (!q) return esc(text);
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  let out = "", last = 0, m;
  while ((m = rx.exec(text))) { out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>"; last = m.index + m[0].length; if (!m[0]) rx.lastIndex++; }
  return out + esc(text.slice(last));
}
async function runSearch() {
  const q = $("sq").value.trim(), seq = ++sSeq;
  let hits;
  if (!q) hits = list.slice(0, 30);
  else {
    try { hits = await api(OW + `v1/chats/search?text=${enc(q)}`); }
    catch { hits = list.filter(c => (c.title || "").toLowerCase().includes(q.toLowerCase())); }   // fall back to titles
  }
  if (seq !== sSeq) return;                              // a newer keystroke superseded this answer
  sHits = hits; sIdx = 0; renderSearch(q);
}
function renderSearch(q) {
  $("sres").innerHTML = sHits.length ? sHits.map((c, i) => {
    const snip = q && c.snippet && c.snippet !== c.title ? `<small>${mark(c.snippet, q)}</small>` : "";
    return `<div class="sr${i === sIdx ? " act" : ""}" data-i="${i}"><b>${mark(c.title || "Chat", q)}</b>${snip}</div>`;
  }).join("") : `<div class="snone">Keine Treffer</div>`;
  const a = $("sres").querySelector(".act"); if (a) a.scrollIntoView({block: "nearest"});
}
function pickHit(i) { const c = sHits[i]; if (c) { closeSearch(); openChat(c.id); } }
$("sq").oninput = () => { clearTimeout(sTimer); sTimer = setTimeout(runSearch, 180); };
$("sq").onkeydown = e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); sIdx = Math.max(0, Math.min(sHits.length - 1, sIdx + (e.key === "ArrowDown" ? 1 : -1))); renderSearch($("sq").value.trim());
  } else if (e.key === "Enter") { e.preventDefault(); pickHit(sIdx); }
};
$("sres").onclick = e => { const r = e.target.closest(".sr"); if (r) pickHit(+r.dataset.i); };
$("search").onclick = e => { if (e.target === $("search")) closeSearch(); };
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("search").classList.contains("on") ? closeSearch() : openSearch(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === ",") { e.preventDefault(); openSettings(); }
  else if (e.key === "Escape") { closeSearch(); closeSettings(); document.querySelectorAll(".menu.on, .umenu.on").forEach(m => m.classList.remove("on")); $("userMenu").classList.remove("on"); $("picker").classList.remove("on"); }
});

function newChat() {
  if (streaming) streaming.abort();
  chat = {id: null, title: "Neuer Chat", model: $("model").value, workdir: localStorage.workdir || null, perm: "ask", history: {messages: {}, currentId: null}, updated_at: 0};
  resetPanel(); render(); loadList();
}

async function openChat(id) {
  if (streaming) streaming.abort();
  const c = await api(OW + `v1/chats/${id}`);
  chat = {id, title: c.title, workdir: c.chat.workdir || null, perm: "ask", model: (c.chat.models || [])[0] || $("model").value,
          history: c.chat.history || {messages: {}, currentId: null}, updated_at: c.updated_at, raw: c.chat};
  if ([...$("model").options].some(o => o.value === chat.model)) $("model").value = chat.model;
  addRecent(chat.workdir); resetPanel(); render(); loadList();
}

// ---- rendering ---------------------------------------------------------
function branch() {          // linear path root -> currentId
  const out = [], m = chat.history.messages;
  for (let id = chat.history.currentId; id && m[id]; id = m[id].parentId) out.unshift(m[id]);
  return out;
}
function md(text) {
  const parts = text.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) { const nl = p.indexOf("\n"); return `<pre><code>${esc(p.slice(nl + 1).replace(/\n$/, ""))}</code></pre>`; }
    return esc(p).split(/\n{2,}/).map(par => `<p>${par.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>")}</p>`).join("");
  }).join("");
}
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
let userFirst = "";
const openSet = new Set();
const enc = encodeURIComponent;
const norm = p => {   // folder-relative path: models sometimes send ./x or absolute paths
  p = p.replace(/^\.\//, "");

  const msgs = chat.history.messages;
  const flat = Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp);
  return {id: chat.id || "", title: chat.title, models: [chat.model], params: {},
          history: chat.history, workdir: chat.workdir, messages: flat, tags: [], files: [], timestamp: Date.now()};
}
async function save() {
  if (!chat.id) {
    const c = await api(OW + "v1/chats/new", json("POST", {chat: toOpenWebUI(), folder_id: null}));
    chat.id = c.id; chat.updated_at = c.updated_at;
  } else {
    const c = await api(OW + `v1/chats/${chat.id}`, json("POST", {chat: toOpenWebUI()}));
    chat.updated_at = c.updated_at;
  }
}

const TOOLS = [
  ["read_file", "Read a text file (line-numbered). Use offset/limit for large files.", {path: "string", offset: "integer", limit: "integer"}, ["path"]],
  ["write_file", "Create or overwrite a file with the given content.", {path: "string", content: "string"}, ["path", "content"]],
  ["edit_file", "Replace old_string with new_string in a file. old_string must match exactly once unless replace_all is true. Read the file first.", {path: "string", old_string: "string", new_string: "string", replace_all: "boolean"}, ["path", "old_string", "new_string"]],
  ["list_dir", "List a directory.", {path: "string"}, []],
  ["glob", "Find files by glob pattern, e.g. **/*.py", {pattern: "string", path: "string"}, ["pattern"]],
  ["grep", "Search file contents with a regex. Returns path:line:text.", {pattern: "string", path: "string", include: "string"}, ["pattern"]],
  ["bash", "Run a shell command in the working folder. Returns combined output and exit code.", {command: "string", timeout: "integer"}, ["command"]],
].map(([name, description, props, required]) => ({type: "function", function: {name, description, parameters: {type: "object",
  properties: Object.fromEntries(Object.entries(props).map(([k, t]) => [k, {type: t}])), required}}}));

const sysPrompt = () => `You are a coding agent working in the user's project folder: ${chat.workdir}
Use the tools to explore the project, read and edit files, and run commands. Paths are relative to that folder.
Read a file before editing it; prefer edit_file for small changes. Verify your work (run tests or the program) when possible.
Be concise. When finished, summarize what you changed. Answer in the user's language.`;

function payload(upto) {
  const out = chat.workdir ? [{role: "system", content: sysPrompt()}] : [];
  for (const m of branch()) {
    if (m.role === "user") out.push({role: "user", content: m.content});
    else if (m.steps) for (const s of m.id === upto ? m.steps.slice(0, -1) : m.steps) {  // current message: finished steps only
      if (s.calls && s.calls.length) {
        out.push({role: "assistant", content: s.content || null,
          tool_calls: s.calls.map(c => ({id: c.id, type: "function", function: {name: c.name, arguments: c.args || "{}"}}))});
        for (const c of s.calls) out.push({role: "tool", tool_call_id: c.id, content: c.result ?? "Cancelled."});
      } else if (s.content) out.push({role: "assistant", content: s.content});
    } else if (m.content) out.push({role: "assistant", content: m.content});
  }
  return out;
}

async function streamStep(msgs, step, ctrl) {
  const body = {model: chat.model, stream: true, messages: msgs};
  if (chat.workdir) body.tools = TOOLS;
  const r = await fetch("/v1/chat/completions", {...json("POST", body), signal: ctrl.signal});
  if (r.status === 401) { showLogin(); throw new Error("Nicht angemeldet"); }
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 300)}`);
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:") || line.includes("[DONE]")) continue;
      let d; try { d = JSON.parse(line.slice(5)).choices?.[0]?.delta; } catch { continue; }
      if (!d) continue;
      if (d.content) step.content += d.content;
      if (d.reasoning_content) step.reasoning += d.reasoning_content;
      for (const tc of d.tool_calls || []) {      // arrives in fragments, keyed by index
        const c = step.calls[tc.index ?? 0] ??= {id: "", name: "", args: "", status: "pending"};
        if (tc.id) c.id = tc.id;
        if (tc.function?.name) c.name = c.name || tc.function.name;
        if (tc.function?.arguments) c.args += tc.function.arguments;
      }
    }
    render();
  }
  step.calls = step.calls.filter(c => c && c.name);
  for (const c of step.calls) { c.id = c.id || "call_" + uuid().slice(0, 8); if (!step.reasoning) delete step.reasoning; }
}

async function runCall(c, ctrl) {
  let args;
  try { args = JSON.parse(c.args || "{}"); }
  catch (e) { c.status = "error"; c.result = "Error: arguments are not valid JSON: " + e.message; return; }
  if (!READONLY.has(c.name) && chat.perm !== "auto") {
    c.status = "approval"; render();
    const choice = await new Promise(res => { pending[c.id] = res; ctrl.signal.addEventListener("abort", () => res("deny"), {once: true}); });
    delete pending[c.id];
    if (choice === "deny") { c.status = "denied"; c.result = "The user denied this action."; return; }
    if (choice === "always") { chat.perm = "auto"; }
  }
  c.status = "running"; render();
  const r = await (await fetch("/app/tool", {...json("POST", {workdir: chat.workdir, name: c.name, args}), signal: ctrl.signal})).json();
  c.result = r.output; c.status = r.is_error ? "error" : "done"; c.meta = r.meta || undefined;
  if (!r.is_error && (c.name === "write_file" || c.name === "edit_file")) refreshTab(norm(args.path || ""));
}

async function send(text) {
  const m = chat.history.messages, parent = chat.history.currentId;
  const u = {id: uuid(), parentId: parent, childrenIds: [], role: "user", content: text, timestamp: now(), models: [chat.model]};
  const a = {id: uuid(), parentId: u.id, childrenIds: [], role: "assistant", content: "", steps: [], model: chat.model,
             modelName: $("model").selectedOptions[0].text, modelIdx: 0, timestamp: now(), done: false, started: Date.now()};
  u.childrenIds.push(a.id); if (parent) m[parent].childrenIds.push(u.id);
  m[u.id] = u; m[a.id] = a; chat.history.currentId = a.id;
  if (chat.title === "Neuer Chat") chat.title = text.replace(/\s+/g, " ").slice(0, 50);

  const ctrl = streaming = new AbortController();
  render();
  try {
    for (let turn = 0; turn < 40 && !ctrl.signal.aborted; turn++) {
      const step = {content: "", reasoning: "", calls: []};
      a.steps.push(step);
      await streamStep(payload(a.id), step, ctrl);
      if (!step.calls.length) break;
      for (const c of step.calls) await runCall(c, ctrl);
      render();
      if (turn === 39) a.error = "Abbruch: Limit von 40 Schritten erreicht.";
    }
  } catch (e) { if (e.name !== "AbortError") a.error = String(e.message || e); }
  for (const s of a.steps) for (const c of s.calls)
    if (c.result === undefined) { c.status = "denied"; c.result = "Cancelled."; }
  a.content = a.steps.map(s => s.content).filter(Boolean).join("\n\n");
  a.done = true; streaming = null; render();
  if (a.content || a.steps.some(s => s.calls.length) || !a.error) { try { await save(); } catch (e) { a.error = "Sync fehlgeschlagen: " + e.message; render(); } }
  loadList();
}

$("form").onsubmit = e => {
  e.preventDefault();
  if (streaming) return streaming.abort();
  const text = $("input").value.trim(); if (!text) return;
  $("input").value = ""; $("input").style.height = "auto";
  send(text);
};
$("input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } };
$("input").oninput = () => { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; };
$("new").onclick = newChat;

// ---- sync: pick up changes made elsewhere (web UI, other device) --------
async function sync() {
  if (streaming || document.hidden || $("login").classList.contains("on")) return;
  try {
    await loadList();
    const c = chat && chat.id && list.find(x => x.id === chat.id);
    if (c && c.updated_at > chat.updated_at) await openChat(chat.id);
  } catch {}
}
setInterval(sync, 20000);
document.addEventListener("visibilitychange", sync);

async function boot() {
  const st = await (await fetch("/app/status")).json();
  if (!st.logged_in) return showLogin();
  $("login").classList.remove("on");
  $("who").textContent = (st.user?.name || st.user?.email || "").split(" ")[0];
  userFirst = (st.user?.name || "").split(" ")[0];
  $("av").textContent = (userFirst || st.user?.email || "?")[0].toUpperCase();
  $("uemail").textContent = st.user?.email || "";
  await loadModels(); newChat();
}
addRecent(localStorage.workdir);   // folders used before this feature existed
reportDrag();
applyAppearance();   // styles exist now: report the real background to the native window
boot();
</script>
